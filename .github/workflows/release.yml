name: Release

# Pushing a tag like v0.1.0 builds the binary and publishes a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --release --locked

  publish:
    name: build and publish ${{ github.ref_name }}
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package="video_scale-${version}-x86_64-linux"
          mkdir -p "dist/${package}"
          install -m 755 target/release/video_scale "dist/${package}/"
          install -m 644 README.md "dist/${package}/"
          install -m 644 video_scale.toml lossless.toml "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          (cd dist && zip -qr "${package}.zip" "${package}")
          (cd dist && sha256sum "${package}.tar.gz" "${package}.zip" > SHA256SUMS)
          rm -rf "dist/${package}"

      - name: Release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sed -e "s/{{version}}/${version}/g" \
              -e "s|{{repo}}|${GITHUB_REPOSITORY}|g" \
              -e "s|{{tag}}|${GITHUB_REF_NAME}|g" \
              .github/release-notes.md > dist/notes.md
          cat dist/notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --title "video_scale ${GITHUB_REF_NAME#v}" \
            --notes-file dist/notes.md
