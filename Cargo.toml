[package]
name = "video_scale"
version = "0.1.0"
edition = "2024"
default-run = "video_scale"

[dependencies]
anyhow = "1"
half = "2"
ort = { version = "=2.0.0-rc.14", features = ["cuda", "tensorrt", "half", "lax-feature-matching"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "pipeline"
harness = false
